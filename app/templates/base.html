<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Homelab{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="{% if active == 'home' %}active{% endif %}">Home</a>
            <a href="/menu/menu" class="{% if active == 'menu' %}active{% endif %}">Menu</a>
            <a href="/health/health" class="{% if active == 'health' %}active{% endif %}">Health</a>
            <a href="/docs" target="_blank">API</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <span>homelab · fastapi</span>
    </footer>
</body>
</html>
